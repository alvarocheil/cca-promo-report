[project]
name = "cca-report"
version = "0.1.0"
description = "Weekly Competitor's Promotions Report (CCA) - scraping + PDF"
readme = "README.md"
authors = [
    { name = "alvarovergaravargas", email = "aovv.26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "playwright>=1.65.0",
    "protego>=0.7.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pywin32>=308 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
    "tzdata>=2026.6",
]

[project.scripts]
cca-report = "cca_report.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: renders a real PDF with Chromium"]
